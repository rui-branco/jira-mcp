name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Validate OIDC token exchange
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          # Create secure temp file and ensure cleanup
          RESP_FILE=$(mktemp)
          trap 'rm -f "$RESP_FILE"' EXIT

          # Verify OIDC environment is available
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC environment variables not available. Ensure id-token: write permission is set."
            exit 1
          fi

          # Request GitHub OIDC token with npm audience
          OIDC_RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          OIDC_TOKEN=$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value')
          unset OIDC_RESPONSE

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to obtain GitHub OIDC token"
            exit 1
          fi

          # URL-encode package name using Node.js
          PKG_NAME=$(node -p "encodeURIComponent(require('./package.json').name)")

          # Attempt token exchange (safe - no publish occurs)
          HTTP_CODE=$(curl -s -o "$RESP_FILE" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$PKG_NAME")

          # Clear OIDC token from environment
          unset OIDC_TOKEN

          # Validate response - fail-closed
          # npm returns 201 Created on successful token creation, 200 OK is also acceptable
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Token exchange failed with HTTP $HTTP_CODE"
            jq -r '.message // .error // "Unknown error"' "$RESP_FILE" 2>/dev/null || echo "Could not parse error response"
            exit 1
          fi

          if ! jq -e '.token and (.token | length > 0)' "$RESP_FILE" > /dev/null 2>&1; then
            echo "::error::Token exchange response missing or empty token field"
            exit 1
          fi

          echo "::notice::OIDC token exchange successful - trusted publisher is correctly configured"

      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --access public
